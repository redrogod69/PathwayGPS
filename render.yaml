# One-click deploy: https://render.com/deploy?repo=https://github.com/redrogod69/PathwayGPS
services:
  - type: web
    name: pathwaygps
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PATHWAYGPS_CORS_ORIGINS
        value: https://redrogod69.github.io
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
