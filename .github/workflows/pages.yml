name: Test & deploy PathwayGPS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend tests (offline replay fixtures)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q tests -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build browser-engine app
        working-directory: frontend
        env:
          VITE_ENGINE: browser
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          python3 ../scripts/bundle_py.py
          npm ci
          npx vite build --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
